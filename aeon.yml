# Aeon configuration — Grok Bot Aeon derivative
# Default harness is grok so skills run on Grok models.
# Enable skills by setting enabled: true. See upstream aeonfun/aeon for the full catalog.
# Full skills list and docs: https://github.com/aeonfun/aeon

skills:
  # Self-maintenance & health (recommended)
  skill-health: { enabled: true, schedule: "0 18 * * *" }
  skill-repair: { enabled: true, schedule: "reactive" }
  aeon-update: { enabled: true, schedule: "0 11 * * 1" }  # weekly sync with upstream
  derivative-health: { enabled: true, schedule: "0 10 * * 1" }  # weekly Grok-focused health

  # Grok-focused research
  ai-agent-digest: { enabled: true, schedule: "0 8 * * 1", var: "AI agents Grok Aeon autonomous" }
  grok-status: { enabled: true, schedule: "0 9 * * 1" }

  # Example content skills
  # digest: { enabled: true, schedule: "0 8 * * *", var: "AI agents and Grok" }
  # fetch-tweets: { enabled: false, schedule: "0 17 * * *", var: "topic:AI agents" }

  # Add more from upstream catalog as needed.

# Agent harness — Grok Build by default for this derivative
harness: grok

# Model (applies to claude/grok harnesses; Grok uses its own flagship by default)
model: grok-4.7

# Other config (gateway, channels, etc.) can be added from the dashboard or upstream template.
